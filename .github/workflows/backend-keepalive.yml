name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: backend-keepalive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping backend health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Call backend health endpoint
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_HEALTH_URL:-}" ] || [ "$BACKEND_HEALTH_URL" = "/healthz" ]; then
            echo "::error::GitHub Actions variable BACKEND_BASE_URL is not configured."
            exit 1
          fi

          curl \
            --fail \
            --show-error \
            --silent \
            --connect-timeout 15 \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            "$BACKEND_HEALTH_URL"
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_BASE_URL }}/healthz
